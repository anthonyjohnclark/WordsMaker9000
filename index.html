<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Consolas:wght500;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Lora:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      (function () {
        const themeName =
          localStorage.getItem("wm9000:last-theme") || "midnight";
        const startupPalette = {
          midnight: {
            primary: "#111827",
            secondary: "#000000",
            ink: "#eab308",
            lettering: "#ffffff",
          },
          parchment: {
            primary: "#f5f0e8",
            secondary: "#ede4d4",
            ink: "#b45309",
            lettering: "#3d2b1f",
          },
          ocean: {
            primary: "#0f172a",
            secondary: "#020617",
            ink: "#22d3ee",
            lettering: "#e2e8f0",
          },
          forest: {
            primary: "#1a2e1a",
            secondary: "#0f1f0f",
            ink: "#34d399",
            lettering: "#e2efe2",
          },
          typewriter: {
            primary: "#f5f5f0",
            secondary: "#eaeae5",
            ink: "#1f2937",
            lettering: "#1f2937",
          },
          slate: {
            primary: "#1e293b",
            secondary: "#020617",
            ink: "#f59e0b",
            lettering: "#f8fafc",
          },
        };

        const palette = startupPalette[themeName] || startupPalette.midnight;
        const root = document.documentElement;
        root.style.setProperty("--bg-primary", palette.primary);
        root.style.setProperty("--bg-secondary", palette.secondary);
        root.style.setProperty("--wm-logo-background", palette.secondary);
        root.style.setProperty("--wm-logo-ink", palette.ink);
        root.style.setProperty("--wm-logo-lettering", palette.lettering);
        root.style.setProperty("--wm-logo-outline", palette.secondary);
      })();
    </script>
    <!-- Import your index.css -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordsMaker9000</title>
  </head>
  <body style="margin: 0; background: var(--bg-secondary, #000)">
    <div id="root">
      <!-- Splash screen shown while React loads -->
      <div id="splash" class="splash-screen">
        <svg
          class="splash-logo"
          viewBox="0 0 500 500"
          role="img"
          aria-label="WordsMaker9000"
        >
          <image href="/wordsmaker9000.png" width="500" height="500" />
          <use href="/wordsmaker9000.svg#wordsmaker9000-logo" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
