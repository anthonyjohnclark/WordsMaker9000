<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Consolas:wght500;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Lora:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      (function () {
        // A synchronous snapshot of the resolved theme avoids duplicating presets.
        // On first launch (or an older install), CSS defaults cover the splash
        // until main.tsx loads the authoritative settings file.
        try {
          const cached = JSON.parse(localStorage.getItem("wm9000:startup-theme") || "null");
          if (!cached || cached.version !== 1 || !cached.variables) return;
          const keys = [
            "--bg-primary", "--bg-secondary", "--wm-logo-background",
            "--wm-logo-ink", "--wm-logo-lettering", "--wm-logo-outline",
          ];
          const validColor = (value) =>
            typeof value === "string" && value.length <= 200 &&
            /^(#[\da-f]{3,8}|rgba?\([\d\s.,%]+\)|hsla?\([\d\s.,%+-]+\)|[a-z]+)$/i.test(value) &&
            CSS.supports("color", value) &&
            !/^(inherit|initial|unset|revert|revert-layer|currentcolor)$/i.test(value);
          if (!keys.every((key) => validColor(cached.variables[key]))) return;
          for (const key of keys) {
            document.documentElement.style.setProperty(key, cached.variables[key]);
          }
        } catch {
          // Unavailable storage or an invalid cache falls back to CSS defaults.
        }
      })();
    </script>
    <!-- Import your index.css -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordsMaker9000</title>
  </head>
  <body style="margin: 0; background: var(--bg-secondary, #000)">
    <div id="root">
      <!-- Splash screen shown while React loads -->
      <div id="splash" class="splash-screen">
        <svg
          class="splash-logo"
          viewBox="0 0 500 500"
          role="img"
          aria-label="WordsMaker9000"
        >
          <image href="/wordsmaker9000.png" width="500" height="500" />
          <use href="/wordsmaker9000.svg#wordsmaker9000-logo" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
