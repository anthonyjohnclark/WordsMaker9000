[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls", "system-proxy"] }
log = "0.4"
tauri = { version = "2.1.0", features = ["protocol-asset"] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-fs = "2.0"
genpdf = "0.2"
lopdf = "=0.26.0"
scraper = "0.21"
ego-tree = "0.9"
chrono = "0.4"
docx-rs = { version = "=0.4.22", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
roxmltree = "=0.20.0"
tauri-plugin-dialog = "=2.2.0"
tauri-plugin-opener = "=2.5.4"
tempfile = "3"
typst = "=0.13.1"
typst-as-lib = "=0.14.4"
typst-pdf = "=0.13.1"

# Windows-only: WebView2 context-menu bridge (matches versions Tauri pulls in)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
