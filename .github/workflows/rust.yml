name: Rust

on:
  push:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest", "ubuntu-latest"]
        rust: ["1.88.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Test
        run: cargo +${{ matrix.rust }} test --locked --manifest-path src-tauri/Cargo.toml
